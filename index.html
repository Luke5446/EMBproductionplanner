<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMB production</title>
<style>
:root{--navy:#1F3864;--navy2:#2a4a80;--steel:#5b7ba6;--gold:#C9A24B;--bg:#f4f6f9;--card:#fff;--line:#dfe4ec;--txt:#1c2431;--mut:#6b7686;--red:#c0392b;--green:#1e7e46;--amber:#b7791f;--purple:#6b46c1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;font-weight:600}header h1 span{color:var(--gold)}
header .sub{font-size:12px;opacity:.75}header .spacer{flex:1}
.btn{border:none;border-radius:6px;padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600;background:var(--navy2);color:#fff}
.btn-gold{background:var(--gold);color:#22262e}.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-sm{padding:4px 9px;font-size:12px}.btn-grey{background:#e4e8ef;color:var(--txt)}.btn-green{background:var(--green)}.btn-red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{border:none;background:none;padding:12px 14px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--gold)}
nav .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:5px}
main{max-width:1320px;margin:0 auto;padding:16px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:14px;box-shadow:0 1px 3px rgba(20,30,50,.06);overflow:hidden}
.card h2{font-size:14px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f9fc;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
tr.job{cursor:pointer}tr.job:hover{background:#f6f8fc}tr.open{background:#eef3fb}
td.num,th.num{text-align:right}
.code{font-family:Consolas,monospace;font-weight:600;color:var(--navy)}
.desc{color:var(--mut);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.p-new{background:#fdecc8;color:#7a4b00}.p-conf{background:#dbe7fb;color:#1f3f7a}.p-pick{background:#e3f1e8;color:#1e5a34}.p-part{background:#fff3cd;color:#7a5200}
.p-mach{background:#e9e1fb;color:#4b2e9c}.p-done{background:#d9efe0;color:#155d31}.p-emb{background:#e9e1fb;color:#4b2e9c}.p-tr{background:#d7f0f7;color:#0b5566}
.p-wo{background:#f3e8c8;color:#5c4300}.p-grey{background:#e9ecf1;color:#55606e}.p-short{background:#fde2df;color:#8a1f16}.p-stock{background:#d9efe0;color:#155d31}.p-ready{background:#d9efe0;color:#155d31}
.co{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:4px}.co-t{background:var(--navy);color:#fff}.co-o{background:var(--gold);color:#22262e}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.tile b{font-size:24px;color:var(--navy);display:block}.tile span{font-size:12px;color:var(--mut)}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,75,.35)}
.detail{background:#fafbfd;padding:12px 14px;border-bottom:1px solid var(--line)}
.detail .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff}
.field textarea{min-height:56px}
.sagetxt{font-size:12px;color:#4b2e9c;background:#f3effd;border-radius:5px;padding:3px 7px;margin-top:3px;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.muted{color:var(--mut);font-size:12px}
.clip{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{padding:10px 14px;font-size:13px;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.status{font-size:12px;color:var(--mut);padding:8px 14px}
.late{color:var(--red);font-weight:600}
.chk{width:17px;height:17px;vertical-align:middle;cursor:pointer}

.bin{font-family:Consolas,monospace;font-weight:700;background:#eef3fb;border-radius:4px;padding:1px 6px}
.logoimg{max-height:70px;max-width:180px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important}body{background:#fff}}
.wop{font-family:'Segoe UI',Arial,sans-serif;color:#000;padding:10mm;page-break-after:always;max-width:190mm}
.wop .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1F3864;padding-bottom:6px;margin-bottom:10px}
.wop .hd h1{font-size:22px;color:#1F3864}.wop .hd .k{font-size:28px;font-weight:700}
.wop .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:14px;margin-bottom:10px}
.wop .kv b{color:#333;font-weight:600;display:inline-block;min-width:110px}
.wop table{font-size:13px;margin-top:6px}.wop th{background:#eef1f6;color:#333}.wop td,.wop th{border:1px solid #bbb;padding:5px 7px}
.wop .logo{border:1px solid #bbb;min-height:50mm;display:flex;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:#666;padding:6px}
.wop .logo img{max-height:70mm;max-width:100%}
.wop .sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;font-size:12px}.wop .sign div{border-top:1px solid #333;padding-top:4px}
.wop .big{font-size:16px;font-weight:600;margin-top:8px}
.wop .bigbin{font-family:Consolas,monospace;font-size:16px;font-weight:700}
@media (max-width:700px){main{padding:10px 8px}th,td{padding:6px 7px}}

<body>
<header><h1>EMB <span>production</span></h1><div class="sub">Embroidery &amp; transfer jobs · Tibard and Oliver Harvey</div><div class="spacer"></div>
<span id="hdrInfo" class="sub"></span>
<button class="btn btn-ghost btn-sm" onclick="loadAll(true)">Refresh</button>
<span id="userBox"></span><button class="btn btn-ghost btn-sm" onclick="setupPC()" id="tokBtn">Set up this PC</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="print"></div>
<script>
/* EMB production app - phase 1 (25 Nov 2026).
   v0.2: Orders tab shows only jobs needing action (logo + placement, or an uploaded works order file), filter by Sage sales
   person; works order files upload to wo/ in this repo; stitch count is the EMB manager's, remembered per logo; pick list
   works out what is in stock (oldest promised date first, back-to-back POs, planner works orders, containers), shows bins
   from BinFinder, ready-to-pick list with bulk pick-doc print = Picking; planner works orders pull logo and placement
   from the planner's style master.
   Reads: Order tracker data.json (raw Sage paste), Production Plan data.json + style master, Stock Planner data.json,
   Tibard-Cutlog warehouse.json, BinFinder stock.csv. Writes emb.json and wo/ files in this repo with the PC's token. */
const VER='0.3';
const SOP_URL='https://luke5446.github.io/SOPtracker/data.json';
const PP_URL='https://luke5446.github.io/Tibard-Productionplan/data.json';
const PP_HTML='https://luke5446.github.io/Tibard-Productionplan/index.html';
const SP_URL='https://luke5446.github.io/Tibard-Stock-Planner/data.json';
const WH_URL='https://luke5446.github.io/Tibard-Cutlog/warehouse.json';
const BIN_URL='https://luke5446.github.io/Binfinder/stock.csv';
const OWN_REPO='Luke5446/EMBproductionplanner', OWN_FILE='emb.json';
const OWN_API='https://api.github.com/repos/'+OWN_REPO+'/contents/', OWN_PAGES='https://luke5446.github.io/EMBproductionplanner/';
const LS_TOKEN='emb_token', LS_TAB='emb_tab', LS_SET='emb_settings', LS_USER='emb_user';
const DEFAULT_USERS=[{"key":"emb","name":"EMB manager","role":"EMB room","pinHash":"0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c","edits":["emb","logos","settings"]},{"key":"sales","name":"Sales office","role":"Sales office","pinHash":"edee29f882543b956620b26d0ee0e7e950399b1c4222f5de05e06425b4c995e9","edits":["orders"]},{"key":"warehouse","name":"Warehouse","role":"Warehouse","pinHash":"318aee3fed8c9d040d35a7fc1fa776fb31303833aa2de885354ddf3d44d8fb69","edits":["pick"]},{"key":"admin","name":"Admin","role":"Admin","pinHash":"9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0","edits":["orders","pick","emb","logos","settings","users"]}];
let USER=lsGet(LS_USER,null);   // the signed-in user on this PC: {key,name,edits}
// a share link ...#token=XXXX puts the token on this PC and clears the address bar
(function(){const m=/[#&]token=([^&]+)/.exec(location.hash||'');if(m){try{localStorage.setItem(LS_TOKEN,decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}})();
const MACHINES=[{id:'1',name:'Machine 1',heads:6},{id:'2',name:'Machine 2',heads:6},{id:'3',name:'Machine 3',heads:6},{id:'4',name:'Machine 4',heads:6},{id:'5',name:'Machine 5 (single head)',heads:1},{id:'DTF2',name:'DTF twin press',heads:2},{id:'DTF1',name:'DTF single press',heads:1}];
const DEF_SET={spm:900,setup:10,leadTib:10,leadOH:7};
let SET=Object.assign({},DEF_SET,lsGet(LS_SET,{}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const pd=s=>{if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d};
const iso=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';
const fdl=d=>d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'–';
const fdt=s=>s?new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const num=s=>{const n=parseFloat(String(s||'').replace(/,/g,''));return isNaN(n)?0:n};
const soNo=s=>String(s||'').replace(/^0+/,'');
const baseCode=c=>String(c||'').replace(/^BULK/,'');
const coTag=c=>c==='TIBARD'?'<span class="co co-t">TIB</span>':'<span class="co co-o">OH</span>';
const BANK_HOLS=new Set(['2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-08-31','2026-12-25','2026-12-28','2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31','2027-08-30','2027-12-27','2027-12-28']);
const isWorkDay=d=>d.getDay()!==0&&d.getDay()!==6&&!BANK_HOLS.has(iso(d));
function addWorkDays(d,n){let x=new Date(d);while(n>0){x.setDate(x.getDate()+1);if(isWorkDay(x))n--}return x}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const PROFORMA_ACCTS=['PROFORMA','PROFEURO','XONLINE'];
const custName=o=>{if(PROFORMA_ACCTS.includes((o.acct||'').toUpperCase())&&(o.ref||'').trim())return o.ref.trim().replace(/^(EMB|DTF):\s*/i,'');return o.acctName||o.acct||''};

/* ── the paste: same layout as the Order tracker (A–AD) ───────────────── */
const isEmbCode=c=>/^(LOGO|TEXT)(APPLICATION|ORIGINATION)/.test(c||'');
const txtKind=t=>/transfer|\bdtf\b|\bprint/i.test(t||'')?'Transfer':/embroid|\bemb\b|logo|personalis|monogram|initial|\bname\b|\btext\b/i.test(t||'')?'EMB':'';
function parseRaw(txt){
  const so=[],po=[],stk=[],txts=[];
  txt.replace(/\r/g,'').split('\n').forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t').map(x=>{x=x.trim();if(x.length>1&&x[0]==='"'&&x[x.length-1]==='"')x=x.slice(1,-1).replace(/""/g,'"');return x.trim()});
    if(!/^(SO|PO|TXT|STK)$/.test(c[0])||c.length<20)return;
    if(c[0]==='TXT'){if(c[4])txts.push({co:c[1],doc:c[5],seq:num(c[6]),text:c[4]});return}
    if(c[0]==='SO'){so.push({key:c[2],co:c[1],code:c[3].toUpperCase(),desc:c[4],doc:c[5],seq:num(c[6]),acct:c[7],acctName:c[8],ref:c[9],date:c[10]||'',q1:num(c[11]),q2:num(c[12]),out:num(c[13]),alloc:c[14]===''?0:num(c[14]),link:c[16]||'',ic:c[18]==='Y',hold:c[27]==='1',added:c[28]||'',user:c[29]||''});return}
    if(c[0]==='PO'){po.push({co:c[1],code:c[3].toUpperCase(),doc:c[5],acct:c[7],acctName:c[8],date:c[10]||'',out:num(c[13]),ic:c[18]==='Y',hold:c[27]==='1'});return}
    stk.push({co:c[1],code:c[3].toUpperCase(),name:c[4],inStock:num(c[11]),alloc:num(c[12]),free:num(c[13]),onPO:num(c[14]),mfr:c[19],grp:c[22]});
  });
  return{so,po,stk,txt:txts};
}
// which garment lines get a logo / transfer (the Order tracker's rule, v2.13)
function tagEmbLines(o){
  o.lines.forEach(l=>{l.embOn='';l.embTxt=[]});
  const items=o.lines.map(l=>({t:'ln',seq:l.seq,l})).concat((o.texts||[]).map(x=>({t:'txt',seq:x.seq,x}))).sort((a,b)=>a.seq-b.seq);
  let last=null,group=[],prevHit=[],pending=[],afterMarker=false;
  const mark=(l,kind,note)=>{if(!l.embOn)l.embOn=kind;else if(!l.embOn.includes(kind))l.embOn='EMB + Transfer';if(note&&!l.embTxt.includes(note))l.embTxt.push(note)};
  const sumQ=ls=>ls.reduce((a,l)=>a+l.q1,0);
  const apply=(kind,qty,note)=>{
    let hit=[];
    if(afterMarker&&prevHit.length&&sumQ(prevHit)===qty){prevHit.forEach(g=>mark(g,kind,note));return}
    if(group.length&&group[0].q1===qty)hit=[group[0]];
    else{let sum=0;for(const g of group){sum+=g.q1;hit.push(g);if(sum>=qty)break}if(sum!==qty)hit=[]}
    if(hit.length){hit.forEach(g=>mark(g,kind,note));prevHit=hit;group=group.filter(g=>!hit.includes(g));return}
    if(!group.length&&prevHit.length&&sumQ(prevHit)===qty){prevHit.forEach(g=>mark(g,kind,note));return}
    pending.push({kind,qty,note,sum:0,lines:[],fallback:group.slice(0,1)});
  };
  const settle=p=>{const ls=p.lines.length&&p.sum===p.qty?p.lines:p.fallback.length?p.fallback:last?[last]:[];ls.forEach(g=>mark(g,p.kind,p.note));if(p.sum===p.qty){prevHit=ls;group=group.filter(g=>!ls.includes(g))}};
  items.forEach(it=>{
    if(it.t==='txt'){const k=txtKind(it.x.text);if(k&&last)mark(last,k,it.x.text);return}
    const l=it.l;
    if(l.transfer){apply('Transfer',l.q1,(l.desc||l.code).trim());afterMarker=true;return}
    if(isEmbCode(l.code)){if(/ORIGINATION/.test(l.code))return;apply('EMB',l.q1,(l.desc||'').replace(/^EMBROIDERY (LOGO|TEXT) (APPLICATION|ORIGINATION) CHARGE[\s-]*/i,'').trim());afterMarker=true;return}
    if(l.charge)return;
    afterMarker=false;last=l;group.unshift(l);
    pending.forEach(p=>{p.lines.push(l);p.sum+=l.q1});
    pending.filter(p=>p.sum>=p.qty).forEach(settle);pending=pending.filter(p=>p.sum<p.qty);
  });
  pending.forEach(settle);
}

/* ── feeds ─────────────────────────────────────────────────────────────── */
let SOP={ok:false,err:'',ts:'',so:[],po:[],stk:[],txt:[]}, PP={ok:false,err:'',wos:[],all:[],savedAt:''}, SP={ok:false,cPOs:[]}, WH={ok:false,err:'',entries:[]}, BIN={ok:false,map:new Map()}, BRAND={ok:false,styles:[],at:0};
let OWN={ok:false,err:'',sha:null,jobs:{},logos:[],users:[],savedAt:'',source:''};
let JOBS=[],TAB=lsGet(LS_TAB,'orders'),OPEN=null,FILTER={co:'',q:'',tile:'',user:'',all:false},TICK=new Set();
function getJSON(url){return fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function loadAll(force){
  document.getElementById('hdrInfo').textContent='Loading…';
  const a=getJSON(SOP_URL).then(j=>{const p=parseRaw(j.raw||'');SOP={ok:true,err:'',ts:j.ts||j.savedAt||'',so:p.so,po:p.po,stk:p.stk,txt:p.txt}}).catch(e=>{SOP.ok=false;SOP.err=String(e.message||e)});
  const b=getJSON(PP_URL).then(j=>{PP={ok:true,err:'',all:j.WOs||[],wos:(j.WOs||[]).filter(w=>w.embOnly),smPending:j.smPending||{},savedAt:j.savedAt||''}}).catch(e=>{PP.ok=false;PP.err=String(e.message||e)});
  const c=getJSON(WH_URL).then(j=>{WH={ok:true,err:'',entries:j.entries||[]}}).catch(e=>{WH.ok=false;WH.err=String(e.message||e)});
  const d=ownLoad();
  const e=getJSON(SP_URL).then(j=>{SP={ok:true,cPOs:j.cPOs||[]}}).catch(()=>{SP.ok=false});
  const f=fetch(BIN_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=new Map();t.replace(/\r/g,'').split('\n').slice(1).forEach(l=>{const c=l.split(',');if(c[0]&&c[2])m.set(c[0].trim().toUpperCase(),c[2].trim())});BIN={ok:m.size>0,map:m}}).catch(()=>{BIN.ok=false});
  // the planner's style master (logo, placement and logo image per branded code) sits in its index.html; read once a day
  const g=(BRAND.ok&&Date.now()-BRAND.at<20*3600*1000)?Promise.resolve():fetch(PP_HTML+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=/var STYLE_MASTER=(\{.*?\});?\n/.exec(t);if(!m)return;const sm=JSON.parse(m[1]);
    BRAND={ok:true,at:Date.now(),styles:(sm.styles||[]).filter(s=>!s.template&&(s.brandType||s.brandPlace||s.logoImg)).map(s=>({code:s.code,alias:s.alias||[],customer:s.customer||'',brandType:s.brandType||'',brandPlace:s.brandPlace||'',logoImg:s.logoImg||'',placeImg:s.placeImg||''}))}}).catch(()=>{});
  Promise.all([a,b,c,d,e,f,g]).then(()=>{build();render()});
}
function styleFor(code){
  code=(code||'').toUpperCase();
  for(const st of BRAND.styles){for(const tpl of [st.code].concat(st.alias)){const t=tpl.toUpperCase();
    if(t.indexOf('--')<0){if(code===t)return st;continue}
    const re=new RegExp('^'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace('\\-\\-','([A-Z0-9]{1,4}?)').replace('--','([A-Z0-9]{1,4}?)')+'$');if(re.test(code))return st}}
  return null;
}
function ownApply(j,sha,src){OWN.ok=true;OWN.err='';OWN.sha=sha||null;OWN.jobs=j.jobs||{};OWN.logos=j.logos||[];OWN.users=(j.users&&j.users.length)?j.users:DEFAULT_USERS;OWN.savedAt=j.savedAt||'';OWN.source=src;
  if(USER){const u=OWN.users.find(x=>x.key===USER.key);if(!u){USER=null;lsSet(LS_USER,null)}else{USER={key:u.key,name:u.name,edits:u.edits||[]};lsSet(LS_USER,USER)}}}
function ownLoad(){
  const tok=token();
  if(tok)return fetch(OWN_API+OWN_FILE+'?t='+Date.now(),{headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'},cache:'no-store'})
    .then(r=>{if(r.status===404)return{empty:true};if(!r.ok)throw new Error('GitHub said '+r.status+(r.status===401?' (token refused)':''));return r.json()})
    .then(j=>{if(j.empty){ownApply({jobs:{}},null,'api');return}ownApply(JSON.parse(b64d(j.content)),j.sha,'api')}).catch(e=>{OWN.err=String(e.message||e);return ownPages()});
  return ownPages();
}
function ownPages(){
  return getJSON(OWN_FILE).then(j=>ownApply(j,null,'pages')).catch(e=>{if(/404/.test(e.message)){ownApply({jobs:{}},null,'pages');return}OWN.ok=false;OWN.err=String(e.message||e)});
}
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=b=>decodeURIComponent(escape(atob((b||'').replace(/\s/g,''))));
function token(){try{return localStorage.getItem(LS_TOKEN)||''}catch(e){return ''}}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function can(area){return canWrite()&&!!USER&&(USER.edits||[]).includes(area)}
async function signIn(){
  const pin=prompt('Enter your PIN');if(pin==null||!pin.trim())return;
  const h=await sha256(pin.trim());const u=OWN.users.find(x=>x.pinHash===h);
  if(!u){alert('PIN not recognised.');return}
  USER={key:u.key,name:u.name,edits:u.edits||[]};lsSet(LS_USER,USER);try{localStorage.setItem('emb_who',u.name)}catch(e){}render();
}

async function changePin(key){
  const u=OWN.users.find(x=>x.key===(key||(USER&&USER.key)));if(!u)return;
  let h=null;
  if(!key||key===(USER&&USER.key)){const cur=prompt('Current PIN for '+u.name);if(cur==null)return;if(await sha256(cur.trim())!==u.pinHash){alert('Current PIN not recognised.');return}}
  const n1=prompt('New PIN for '+u.name+' (4 or more digits)');if(n1==null)return;if(!/^\d{4,}$/.test(n1.trim())){alert('Use 4 or more digits.');return}
  const n2=prompt('New PIN again');if(n2==null||n2.trim()!==n1.trim()){alert('The two PINs differ.');return}
  h=await sha256(n1.trim());
  if(OWN.users.some(x=>x.pinHash===h&&x.key!==u.key)){alert('That PIN is already in use. Choose another.');return}
  ownSave('PIN changed for '+u.name,d=>{const x=d.users.find(y=>y.key===u.key);if(!x)return false;x.pinHash=h;return true},ok=>{if(ok){alert('PIN changed.');render()}});
}

const ghHeaders=()=>({'Authorization':'Bearer '+token(),'Accept':'application/vnd.github+json'});
// write: read the latest emb.json, apply the change, put it back with its sha; retry on a sha clash or a 5xx
function ownSave(message,mutate,cb,attempt){
  if(!token()){alert('This PC has no token. Use "Set up this PC" first.');if(cb)cb(false);return}
  attempt=attempt||1;
  const again=()=>setTimeout(()=>ownSave(message,mutate,cb,attempt+1),attempt*1500);
  fetch(OWN_API+OWN_FILE+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'})
    .then(r=>{if(r.status===404)return{empty:true};if(r.status>=500&&attempt<4){again();return null}if(!r.ok)throw new Error('GitHub said '+r.status);return r.json()})
    .then(j=>{if(!j)return null;
      const d=j.empty?{jobs:{},logos:[]}:JSON.parse(b64d(j.content)),sha=j.empty?null:j.sha;d.jobs=d.jobs||{};d.logos=d.logos||[];if(!d.users||!d.users.length)d.users=JSON.parse(JSON.stringify(DEFAULT_USERS));
      if(mutate(d)===false){ownApply(d,sha,'api');if(cb)cb(true);return null}
      d.savedAt=new Date().toISOString();d.app='EMB production';d.ver=VER;
      const body={message,content:b64e(JSON.stringify(d,null,1))};if(sha)body.sha=sha;
      return fetch(OWN_API+OWN_FILE,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)})
        .then(r=>{if((r.status===409||r.status===422||r.status>=500)&&attempt<4){again();return null}if(!r.ok)throw new Error('GitHub said '+r.status);return r.json()})
        .then(res=>{if(!res)return;ownApply(d,res.content&&res.content.sha,'api');if(cb)cb(true)});
    }).catch(e=>{alert('Could not save: '+e.message+'\n\nNothing was lost - try again in a moment.');if(cb)cb(false)});
}
// put a file (a works order PDF / image / xlsx) into wo/ in this repo
function ownPutFile(path,bytesB64,message,cb){
  fetch(OWN_API+path+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'}).then(r=>r.status===404?{}:r.ok?r.json():Promise.reject(new Error('GitHub said '+r.status)))
    .then(j=>{const body={message,content:bytesB64};if(j.sha)body.sha=j.sha;
      return fetch(OWN_API+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)})})
    .then(r=>{if(!r.ok)throw new Error('GitHub said '+r.status);cb(true)}).catch(e=>{alert('Upload failed: '+e.message);cb(false)});
}

/* ── build the jobs ─────────────────────────────────────────────────────── */
function build(){
  JOBS=[];
  const stkIdx=new Map();SOP.stk.forEach(s=>stkIdx.set(s.co+'|'+s.code,s));
  const stkFor=(co,code)=>stkIdx.get(co+'|'+code)||null;
  const orders=new Map(),allLines=[];
  SOP.so.forEach(l=>{
    const k=l.co+'|'+soNo(l.doc);let o=orders.get(k);
    if(!o){o={key:k,co:l.co,doc:soNo(l.doc),acct:l.acct,acctName:l.acctName,ref:l.ref,promised:l.date,added:l.added,user:l.user,hold:l.hold,ic:l.ic,lines:[],texts:[]};orders.set(k,o)}
    if(l.date&&(!o.promised||l.date<o.promised))o.promised=l.date;
    const s=stkFor(l.co,l.code)||stkFor(l.co,baseCode(l.code));
    const ln={key:l.key,pkey:l.key.replace(/-SO-/,'-'),co:l.co,order:o,code:l.code,base:baseCode(l.code),desc:l.desc||(s&&s.name)||'',seq:l.seq,q1:l.q1,q2:l.q2,out:l.out,alloc:Math.min(l.alloc,l.out),link:soNo(l.link),promised:l.date,stk:s,charge:!!s&&(s.grp||'').trim()==='54',freetext:/^FREETEXT/.test(l.code),ic:l.ic,hold:l.hold,sources:[]};
    ln.transfer=!!s&&(s.grp||'').trim()==='53'&&(/transfer/i.test((l.desc||'')+' '+(s.name||''))||/^(ID|TX)\d/.test(l.code));
    o.lines.push(ln);allLines.push(ln);
  });
  SOP.txt.forEach(x=>{const o=orders.get(x.co+'|'+soNo(x.doc));if(o)o.texts.push(x)});
  orders.forEach(o=>{o.lines.sort((a,b)=>a.seq-b.seq);o.texts.sort((a,b)=>a.seq-b.seq);tagEmbLines(o)});

  // ── who gets the stock: per company and code, oldest promised date first (the Order tracker's rule); then the
  // back-to-back PO Sage raised from the order, the planner's works order for the line or the code, a container, else short
  const poByDoc=new Map();SOP.po.filter(p=>p.out>0&&!p.hold).forEach(p=>{const k=soNo(p.doc);if(!poByDoc.has(k))poByDoc.set(k,[]);poByDoc.get(k).push({src:p,left:p.out})});
  const smWO=new Map();PP.all.forEach(w=>{if(w.sm&&w.sm.lineKey)smWO.set(w.sm.lineKey,w)});
  const woByCode=new Map();PP.all.forEach(w=>{if(w.sm)return;(w.items||[]).forEach(it=>{const b=baseCode(it.code);if(!woByCode.has(b))woByCode.set(b,[]);woByCode.get(b).push({w,left:it.qty})})});
  const contByCode=new Map();SP.cPOs.forEach(c=>(c.items||[]).forEach(it=>{const b=baseCode(it.code);if(!contByCode.has(b))contByCode.set(b,[]);contByCode.get(b).push({c,left:it.qty})}));
  const pools=new Map();
  allLines.filter(l=>l.out>0&&!l.charge&&!l.freetext&&!l.hold&&!l.ic).forEach(l=>{const k=l.co+'|'+l.base;if(!pools.has(k))pools.set(k,[]);pools.get(k).push(l)});
  pools.forEach((lines,key)=>{
    const [co,base]=key.split('|');
    lines.sort((a,b)=>(a.promised||'9999').localeCompare(b.promised||'9999')||(a.order.added||'9999').localeCompare(b.order.added||'9999')||a.order.doc.localeCompare(b.order.doc)||a.seq-b.seq);
    let stock=0;[base,'BULK'+base].forEach(c=>{const s=stkFor(co,c);if(s&&s.free>0)stock+=s.free});
    const wos=(woByCode.get(base)||[]).slice().sort((a,b)=>(a.w.createdAt||'').localeCompare(b.w.createdAt||''));
    const conts=(contByCode.get(base)||[]).slice().sort((a,b)=>(a.c.date||'').localeCompare(b.c.date||''));
    lines.forEach(ln=>{
      let need=ln.out;const src=ln.sources;
      if(ln.alloc>0){const q=Math.min(ln.alloc,need);need-=q;src.push({t:'stock',qty:q,alloc:true})}
      const sm=smWO.get(ln.pkey);
      if(need>0&&sm){const q=Math.min(need,(sm.items||[]).reduce((x,i)=>x+i.qty,0)||need);need-=q;src.push({t:'wo',qty:q,ref:sm.ref,due:sm.due,sm:true})}
      if(need>0&&!sm&&PP.smPending&&PP.smPending[ln.pkey]){src.push({t:'smpend',qty:need});need=0}
      if(need>0&&stock>0){const q=Math.min(stock,need);stock-=q;need-=q;src.push({t:'stock',qty:q})}
      if(need>0&&ln.link)(poByDoc.get(ln.link)||[]).filter(p=>baseCode(p.src.code)===base&&p.left>0).forEach(p=>{if(need<=0)return;const q=Math.min(p.left,need);p.left-=q;need-=q;src.push({t:'po',qty:q,ref:soNo(p.src.doc),date:p.src.date,b2b:true,sup:p.src.acctName})});
      for(const w of wos){if(need<=0)break;if(w.left<=0)continue;const q=Math.min(w.left,need);w.left-=q;need-=q;src.push({t:'wo',qty:q,ref:w.w.ref,due:w.w.due})}
      for(const c of conts){if(need<=0)break;if(c.left<=0)continue;const q=Math.min(c.left,need);c.left-=q;need-=q;src.push({t:'cont',qty:q,ref:c.c.ref,date:c.c.date})}
      if(need>0)src.push({t:'short',qty:need});
    });
  });

  // ── one job per order per kind (EMB / Transfer); a garment with both is on both jobs
  orders.forEach(o=>{
    if(o.ic)return;
    const refKind=/^\s*(DTF|PRINT)\b/i.test(o.ref||'')?'Transfer':/^\s*EMB\b/i.test(o.ref||'')?'EMB':'';
    ['EMB','Transfer'].forEach(kind=>{
      let garms=o.lines.filter(l=>!l.charge&&!l.freetext&&!l.transfer&&l.embOn&&l.embOn.includes(kind));
      const markers=o.lines.filter(l=>kind==='EMB'?isEmbCode(l.code)&&!/ORIGINATION/.test(l.code):l.transfer);
      if(!garms.length&&refKind===kind)garms=o.lines.filter(l=>!l.charge&&!l.freetext&&!l.transfer);
      if(!garms.length)return;
      const liveGarms=garms.filter(l=>l.out>0);
      if(!liveGarms.length&&!markers.some(l=>l.out>0))return;
      const jk=o.key+'|'+kind;
      const lead=o.co==='TIBARD'?SET.leadTib:SET.leadOH;
      const added=pd(o.added)||today();
      // a branded Sage code the planner knows (EGOCICJ0193XS01 ...) brings its logo and placement with it
      const st=liveGarms.map(l=>styleFor(l.code)).find(Boolean);
      const j={key:jk,src:'sage',kind,co:o.co,doc:o.doc,cust:custName(o),acct:o.acct,ref:o.ref,user:o.user,promised:pd(o.promised),added,due:addWorkDays(added,lead),hold:o.hold,
        lines:liveGarms.map(l=>({key:l.key,code:l.code,base:l.base,desc:l.desc,qty:l.q1,out:l.out,txt:l.embTxt,free:l.stk?l.stk.free:null,sources:l.sources,bin:BIN.map.get(l.base)||BIN.map.get(l.code)||''})),
        markers:markers.map(l=>({code:l.code,desc:l.desc,qty:l.q1})),sageTxt:[...new Set(garms.flatMap(l=>l.embTxt))],own:OWN.jobs[jk]||{},style:st};
      JOBS.push(j);
    });
  });
  // the planner's embroidery-only / DTF works orders (special makes and branded codes), with their marks on the warehouse log
  const wh=new Map();WH.entries.forEach(e=>{if(!e.cancelledAt)wh.set(e.k,e)});
  PP.wos.forEach(w=>{
    const items=w.items||[];const code=items[0]&&items[0].code||'';
    const picks=items.map(it=>wh.get('pick|'+w.ref+'|'+it.code));
    const emb=wh.get('emb|'+w.ref+'|'+code)||{};
    if(wh.get('embbook|'+w.ref+'|'+code))return;
    const sop=items[0]&&items[0].sop&&items[0].sop.covers&&items[0].sop.covers[0]||(w.sm||{});
    const st=styleFor(code);
    const j={key:'wo|'+w.ref,src:'planner',kind:w.dtf?'Transfer':'EMB',co:(w.sm&&w.sm.company)||'TIBARD',doc:soNo(sop.so||(w.sm&&w.sm.so)||''),cust:sop.cust||(w.sm&&(w.sm.custName||w.sm.customer))||(st&&st.customer)||'',ref:w.ref,user:'',promised:pd(w.due),added:pd(w.createdAt)||today(),due:pd(w.due)||today(),
      lines:items.map((it,i)=>({key:w.ref+'|'+it.code,code:it.code,base:w.pickCode||it.code,desc:w.sm?w.sm.desc||'':'',qty:it.qty,out:it.qty,free:null,txt:[],sources:[{t:'wo',qty:it.qty,ref:w.ref,due:w.due,planner:true}],picked:!!picks[i],pickedAt:picks[i]&&picks[i].pickedAt,bin:BIN.map.get(w.pickCode||it.code)||''})),
      markers:[],sageTxt:[],own:OWN.jobs['wo|'+w.ref]||{},wo:w,style:st,machine:emb.machine||'',doneAt:emb.doneAt||'',printed:!!w.printed};
    JOBS.push(j);
  });
  JOBS.forEach(status);
  JOBS.sort((a,b)=>(a.due-b.due)||a.doc.localeCompare(b.doc));
}
const logoMem=name=>OWN.logos.find(l=>l.name&&name&&l.name.toLowerCase()===name.toLowerCase());
function status(j){
  const o=j.own||{},st=j.style;
  j.logo=o.logo||(st?(st.customer?st.customer+' logo':'Logo on '+st.code):'');
  j.place=o.place||(st?st.brandPlace:'');
  j.logoImg=(logoMem(j.logo)||{}).file||(st?st.logoImg:'');
  j.colours=o.colours||'';j.notes=o.notes||'';j.woFile=o.wo||null;
  j.printed=!!o.printedAt;j.pickPrinted=!!o.pickPrintedAt;
  const mem=logoMem(j.logo);j.stitches=o.stitches||(mem?mem.stitches||0:0);j.stitchesFrom=o.stitches?'job':mem&&mem.stitches?'memory':'';
  if(j.src==='sage'){
    j.machine=o.machine||'';j.doneAt=o.doneAt||'';
    j.lines.forEach(l=>{const p=(o.picks||{})[l.key];l.picked=!!p;l.pickedAt=p&&p.at;l.pickedQty=p?p.qty:0});
    j.actioned=!!o.actionedAt||!!j.woFile||(!!j.logo&&!!j.place);
    j.missing=[];if(!j.woFile){if(!j.logo)j.missing.push('logo');if(!j.place)j.missing.push('placement')}
  }else{j.actioned=true;j.missing=[];j.notes=j.notes||'Works order in the Production Plan'}
  const picked=j.lines.filter(l=>l.picked).length;
  j.pickState=picked===0?'none':picked===j.lines.length?'all':'part';
  // stock: every garment on the shelf = ready; what is not on the shelf is in production (works order) or waiting on a PO / container / nothing
  j.lines.forEach(l=>{const s=l.sources||[];l.onShelf=s.length>0&&s.every(x=>x.t==='stock');l.wait=s.length?s.filter(x=>x.t!=='stock'):[{t:'hold',qty:l.out}]});
  const waits=j.lines.filter(l=>!l.picked&&!l.onShelf);
  j.pick=waits.length===0?'ready':waits.every(l=>l.wait.every(x=>x.t==='wo'||x.t==='smpend'))?'wo':'waiting';
  j.shortLines=waits.length;
  if(j.doneAt)j.status='done';
  else if(j.machine)j.status='machine';
  else if(j.pickState==='all')j.status='picked';
  else if(j.pickState==='part')j.status='part';
  else if(j.pickPrinted)j.status='picking';
  else if(j.pick==='ready')j.status='ready';
  else j.status=j.pick==='wo'?'production':'waiting';
  j.late=!j.doneAt&&j.due<today();
  const qty=j.lines.reduce((a,l)=>a+l.out,0);
  const m=MACHINES.find(x=>x.id===j.machine);
  const raw=(j.stitches>0?qty*j.stitches/SET.spm:0)+SET.setup*j.lines.length;
  j.minutes=j.stitches>0?Math.round(raw/(m?m.heads:6)):0;
  j.qty=qty;
}

const TABS=[['orders','Orders'],['pick','Pick list'],['emb','EMB queue'],['done','Done'],['logos','Logos'],['settings','Settings']];

  const live=JOBS.filter(j=>j.status!=='done');
  const counts={orders:live.filter(j=>j.src==='sage'&&!j.actioned).length,pick:live.filter(j=>j.status==='ready').length,emb:live.filter(j=>!j.machine&&j.pickState==='all').length};

  const info=[];if(SOP.ok)info.push('Sage paste '+fdt(SOP.ts));if(OWN.source==='api')info.push('this PC can save');else if(canWrite()&&OWN.err)info.push('GitHub read failed: '+OWN.err);
  document.getElementById('hdrInfo').textContent=info.join(' · ');
  document.getElementById('tokBtn').textContent=canWrite()?'PC set up ✓':'Set up this PC';
  document.getElementById('userBox').innerHTML=USER?`<span class="sub">${esc(USER.name)}</span> <button class="btn btn-ghost btn-sm" onclick="changePin()">PIN</button> <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>`:`<button class="btn btn-gold btn-sm" onclick="signIn()">Sign in</button>`;
  let h='';
  if(!SOP.ok)h+=`<div class="err">The Order tracker's data could not be read${SOP.err?' ('+esc(SOP.err)+')':''}. Jobs come from its daily Sage paste.</div>`;
  if(!PP.ok)h+=`<div class="warn">Production Plan not read${PP.err?' ('+esc(PP.err)+')':''}: works orders are missing.</div>`;
  if(!OWN.ok&&OWN.err)h+=`<div class="warn">emb.json not read (${esc(OWN.err)}): marks made on this app are not shown.</div>`;
  h+=({orders:renderOrders,pick:renderPick,emb:renderEmb,done:renderDone,logos:renderLogos,settings:renderSettings}[TAB]||renderOrders)();
  document.getElementById('main').innerHTML=h;
}
function go(t){TAB=t;OPEN=null;FILTER.tile='';lsSet(LS_TAB,t);render()}
function filterBar(extra){
  return `<div class="filters"><select onchange="FILTER.co=this.value;render()"><option value="">Both companies</option><option value="TIBARD" ${FILTER.co==='TIBARD'?'selected':''}>Tibard</option><option value="OLIVER HARVEY" ${FILTER.co==='OLIVER HARVEY'?'selected':''}>Oliver Harvey</option></select>
  <input placeholder="SO, customer or code" value="${esc(FILTER.q)}" oninput="FILTER.q=this.value;render()" style="min-width:220px">${extra||''}</div>`;
}
function applyFilter(list){const q=FILTER.q.trim().toLowerCase();return list.filter(j=>(!FILTER.co||j.co===FILTER.co)&&(!q||j.doc.includes(q)||(j.cust||'').toLowerCase().includes(q)||j.lines.some(l=>l.code.toLowerCase().includes(q))||(j.ref||'').toLowerCase().includes(q)))}
function jobRow(j,cols,span){
  const open=OPEN===j.key;
  return `<tr class="job ${open?'open':''}" onclick="toggle('${esc(j.key)}')">${cols(j)}</tr>${open?`<tr><td colspan="${span||9}" style="padding:0">${jobDetail(j)}</td></tr>`:''}`;
}
function toggle(k){OPEN=OPEN===k?null:k;render()}
const soCell=j=>`${coTag(j.co)}<span class="code">${esc(j.src==='sage'?j.doc:j.ref)}</span>${j.src==='planner'?' <span class="pill p-wo">WO</span>'+(j.doc?`<div class="muted">SO ${esc(j.doc)}</div>`:''):''}${j.hold?' <span class="pill p-grey">on hold</span>':''}`;
const dueCell=j=>`<span class="${j.late?'late':''}">${fdl(j.due)}</span><div class="muted">promised ${fdl(j.promised)}</div>`;
const linesCell=j=>j.lines.map(l=>`<div><span class="code">${esc(l.code)}</span> × ${l.out}${l.picked?' <span class="pill p-pick">picked</span>':l.onShelf?'':l.wait&&l.wait.length?` <span class="pill ${l.wait.every(x=>x.t==='wo'||x.t==='smpend')?'p-wo':'p-short'}">${esc(waitText(l))}</span>`:''}</div>`).join('');
const logoCell=j=>`${j.logoImg?`<img class="logoimg" src="${esc(j.logoImg)}" style="max-height:40px">`:''}${j.logo?`<div class="muted">${esc(j.logo)}</div>`:''}`;

function renderOrders(){
  const base=applyFilter(JOBS.filter(j=>j.status!=='done'&&j.src==='sage'&&(!FILTER.user||j.user===FILTER.user)));
  const users=[...new Set(JOBS.filter(j=>j.src==='sage').map(j=>j.user).filter(Boolean))].sort();
  const show=FILTER.all?base:base.filter(j=>!j.actioned);
  const extra=`<select onchange="FILTER.user=this.value;render()"><option value="">Every sales person</option>${users.map(u=>`<option ${FILTER.user===u?'selected':''}>${esc(u)}</option>`).join('')}</select>
   <label><input type="checkbox" class="chk" ${FILTER.all?'checked':''} onchange="FILTER.all=this.checked;render()"> show actioned too</label>`;
  return `<div class="card"><h2>Orders needing action <span class="r">${show.length} of ${base.length} jobs · sales office</span></h2>${filterBar(extra)}
  <table><thead><tr><th>Order</th><th>Customer · put on by</th><th>Job</th><th>Garments</th><th>Sage says</th><th>Missing</th><th>Due</th><th>Stock</th></tr></thead><tbody>
  ${show.map(j=>jobRow(j,j=>`<td>${soCell(j)}</td><td>${esc(j.cust)}<div class="muted">${esc(j.ref)}</div><div class="muted">${esc(j.user)}</div></td><td>${kindPill(j.kind)}${logoCell(j)}${j.woFile?`<div><a href="${esc(OWN_PAGES+j.woFile.path)}" target="_blank" onclick="event.stopPropagation()">WO file ↗</a></div>`:''}</td><td>${linesCell(j)}</td><td>${j.sageTxt.map(t=>`<div class="sagetxt">${esc(t)}</div>`).join('')||`<span class="muted">${j.markers.map(m=>esc(m.desc)).join('; ')||'order ref only'}</span>`}</td><td>${j.actioned?'<span class="pill p-done">actioned</span>':j.missing.map(m=>`<span class="pill p-new">${m}</span>`).join(' ')}</td><td>${dueCell(j)}</td><td>${pill(j.status)}</td>`,8)).join('')||'<tr><td colspan="8" class="msg">Nothing needs action.</td></tr>'}</tbody></table>
  <div class="status">A job needs action until it has a logo and a placement, or a works order file uploaded. Open a job to fill it in or upload the works order the sales office made.</div></div>`;
}
function jobDetail(j){
  const o=j.own||{};const w=can('orders')&&j.src==='sage';
  const logoOpts=OWN.logos.filter(l=>!l.acct||l.acct===j.acct);
  let h=`<div class="detail">${j.logoImg?`<img class="logoimg" src="${esc(j.logoImg)}" style="float:right;margin-left:10px">`:''}<div class="grid">
   <div class="field"><label>Logo / design</label><input id="f_logo" list="logos" value="${esc(j.logo)}" ${w?'':'disabled'} placeholder="e.g. Klondyke main logo"><datalist id="logos">${logoOpts.map(l=>`<option value="${esc(l.name)}">`).join('')}</datalist></div>
   <div class="field"><label>Placement</label><input id="f_place" value="${esc(j.place)}" ${w?'':'disabled'} placeholder="${esc(j.sageTxt.join(' / '))}"></div>
   <div class="field"><label>Thread colours</label><input id="f_col" value="${esc(j.colours)}" ${w?'':'disabled'}></div>
   <div class="field"><label>Notes for the EMB room</label><input id="f_notes" value="${esc(j.src==='sage'?j.notes:'')}" ${w?'':'disabled'}></div></div>
   <table style="margin-top:10px"><thead><tr><th>Garment</th><th class="num">Ordered</th><th class="num">To go</th><th>Bin</th><th>Stock</th><th>Picked</th><th>Sage text</th></tr></thead><tbody>
   ${j.lines.map(l=>`<tr><td><span class="code">${esc(l.code)}</span><div class="desc">${esc(l.desc)}</div></td><td class="num">${l.qty}</td><td class="num"><b>${l.out}</b></td><td>${l.bin?`<span class="bin">${esc(l.bin)}</span>`:''}</td><td>${l.onShelf?`<span class="pill p-stock">in stock${l.free!=null?' ('+l.free+' free)':''}</span>`:l.wait&&l.wait.length?`<span class="pill ${l.wait.every(x=>x.t==='wo'||x.t==='smpend')?'p-wo':'p-short'}">${esc(waitText(l))}</span>${l.free!=null?`<div class="muted">${l.free} free</div>`:''}`:'<span class="muted">–</span>'}</td><td>${l.picked?`<span class="pill p-pick">${l.pickedQty||l.out} picked</span> <span class="muted">${fdt(l.pickedAt)}</span>`:'<span class="muted">–</span>'}</td><td>${(l.txt||[]).map(t=>`<div class="sagetxt">${esc(t)}</div>`).join('')}</td></tr>`).join('')}</tbody></table>
   <div class="actions">`;
  if(j.src==='sage'){
    if(w)h+=`<button class="btn btn-gold" onclick="saveJob('${esc(j.key)}')">Save</button><label class="btn btn-grey" style="display:inline-block">Upload works order<input type="file" style="display:none" onchange="uploadWO('${esc(j.key)}',this)"></label>`;
    h+=`<button class="btn btn-grey" onclick="printJobs(['${esc(j.key)}'])">Print EMB WO</button>`;
    if(j.woFile)h+=`<a class="btn btn-grey" href="${esc(OWN_PAGES+j.woFile.path)}" target="_blank">Open WO file: ${esc(j.woFile.name)}</a>`;
    h+=`<span class="muted">${j.actioned?'Actioned '+fdt(o.actionedAt||(j.woFile&&j.woFile.at))+(o.actionedBy||(j.woFile&&j.woFile.by)?' by '+esc(o.actionedBy||j.woFile.by):''):'Needs: '+j.missing.join(' and ')}${j.printed?' · EMB WO printed '+fdt(o.printedAt):''}${j.style?' · logo and placement from the planner record '+esc(j.style.code):''}</span>`;
    if(!w)h+=`<span class="muted">View only: sign in as the sales office to edit.</span>`;
  }else h+=`<span class="muted">Works order ${esc(j.ref)} in the <a href="https://luke5446.github.io/Tibard-Productionplan/" target="_blank">Production Plan</a>; pick and done marks are made there.${j.style?' Logo and placement from its style record.':''}</span>`;
  if(j.doc)h+=`<a class="muted" style="margin-left:auto" href="https://luke5446.github.io/SOPtracker/?so=${esc(j.doc)}" target="_blank">Open in Order tracker ↗</a>`;
  h+=`</div></div>`;
  return h;
}
function saveJob(k){
  const j=JOBS.find(x=>x.key===k);if(!j||!can('orders'))return;
  const v={logo:val('f_logo'),place:val('f_place'),colours:val('f_col'),notes:val('f_notes')};
  ownSave('EMB job '+j.doc+' '+j.kind+' updated',d=>{
    const e=d.jobs[k]||{};Object.assign(e,v,{co:j.co,so:j.doc,kind:j.kind,cust:j.cust});
    if(v.logo&&v.place&&!e.actionedAt){e.actionedAt=new Date().toISOString();e.actionedBy=who()}
    if(v.logo&&!d.logos.some(l=>l.name.toLowerCase()===v.logo.toLowerCase()))d.logos.push({name:v.logo,acct:j.acct,cust:j.cust,place:v.place,stitches:0,at:new Date().toISOString()});
    d.jobs[k]=e;return true;
  },ok=>{if(ok){build();render()}});
}
function uploadWO(k,inp){
  const j=JOBS.find(x=>x.key===k);const f=inp.files&&inp.files[0];if(!j||!f)return;
  if(f.size>20*1024*1024){alert('The file is over 20 MB.');return}
  const safe=f.name.replace(/[^A-Za-z0-9._-]+/g,'_');
  const path='wo/'+(j.co==='TIBARD'?'TIB':'OH')+'-'+j.doc.replace(/[^A-Za-z0-9]/g,'')+'-'+j.kind+'-'+safe;
  const rd=new FileReader();rd.onload=()=>{const b64=String(rd.result).split(',')[1];
    ownPutFile(path,b64,'Works order file for '+j.doc+' '+j.kind,ok=>{if(!ok)return;
      ownSave('EMB job '+j.doc+' '+j.kind+' works order uploaded',d=>{const e=d.jobs[k]||(d.jobs[k]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.wo={path,name:f.name,at:new Date().toISOString(),by:who()};if(!e.actionedAt){e.actionedAt=e.wo.at;e.actionedBy=e.wo.by}return true},ok2=>{if(ok2){build();render()}})})};
  rd.readAsDataURL(f);
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function who(){let w='';try{w=localStorage.getItem('emb_who')||''}catch(e){}if(!w){w=prompt('Your name (kept on this PC, shown on the marks you make):','')||'';try{localStorage.setItem('emb_who',w)}catch(e){}}return w}

/* ── pick list (warehouse) ──────────────────────────────────────────────── */
function renderPick(){
  const all=applyFilter(JOBS.filter(j=>j.status!=='done'&&!j.machine&&j.pickState!=='all'));
  const w=can('pick');
  const ready=all.filter(j=>j.status==='ready'&&j.src==='sage'),picking=all.filter(j=>j.status==='picking'||j.status==='part'),prod=all.filter(j=>j.status==='production'),wait=all.filter(j=>j.status==='waiting');
  const ticked=[...TICK].filter(k=>ready.some(j=>j.key===k));
  const lineRows=(j,showPick)=>j.lines.map((l,i)=>`<tr ${i===0?'style="border-top:2px solid var(--line)"':''}>${i===0?`<td rowspan="${j.lines.length}">${showPick==='tick'?`<input type="checkbox" class="chk" ${TICK.has(j.key)?'checked':''} onchange="tick('${esc(j.key)}',this.checked)"> `:''}${soCell(j)}<div style="margin-top:4px">${pill(j.status)}${j.actioned?'':' <span class="pill p-new">sales to action</span>'}</div>${j.src==='sage'?`<div style="margin-top:6px"><button class="btn btn-grey btn-sm" onclick="printPick(['${esc(j.key)}'])">${j.pickPrinted?'Reprint':'Print pick list'}</button></div>`:''}</td><td rowspan="${j.lines.length}">${esc(j.cust)}<div class="muted">${esc(j.ref)}</div></td><td rowspan="${j.lines.length}">${kindPill(j.kind)}${logoCell(j)}</td>`:''}
    <td><span class="code">${esc(l.base||l.code)}</span>${l.base&&l.base!==l.code?` <span class="muted">→ ${esc(l.code)}</span>`:''}<div class="desc">${esc(l.desc)}</div></td><td class="num"><b>${l.out}</b></td><td>${l.bin?`<span class="bin">${esc(l.bin)}</span>`:'<span class="muted">–</span>'}</td>
    <td>${l.onShelf?`<span class="pill p-stock">in stock</span>${l.free!=null?`<div class="muted">${l.free} free</div>`:''}`:`<span class="pill ${l.wait.every(x=>x.t==='wo'||x.t==='smpend')?'p-wo':'p-short'}">${esc(waitText(l))||'short'}</span>${l.free!=null?`<div class="muted">${l.free} free</div>`:''}`}</td>
    <td>${l.picked?`<span class="pill p-pick">picked</span> <span class="muted">${fdt(l.pickedAt)}</span>${w&&j.src==='sage'?` <button class="btn btn-grey btn-sm" onclick="pickLine('${esc(j.key)}','${esc(l.key)}',0)">Undo</button>`:''}`:j.src==='sage'?(w?`<button class="btn btn-green btn-sm" onclick="pickLine('${esc(j.key)}','${esc(l.key)}',${l.out})">Picked</button>`:'<span class="muted">not picked</span>'):'<span class="muted">mark in the planner</span>'}</td>
    ${i===0?`<td rowspan="${j.lines.length}">${dueCell(j)}${w&&j.src==='sage'&&j.lines.length>1?`<div style="margin-top:6px"><button class="btn btn-green btn-sm" onclick="pickAll('${esc(j.key)}')">All picked</button></div>`:''}</td>`:''}</tr>`).join('');
  const head=`<thead><tr><th>Order</th><th>Customer</th><th>Job</th><th>Garment</th><th class="num">Qty</th><th>Bin</th><th>Stock</th><th>Picked</th><th>Due</th></tr></thead>`;
  const group=(title,sub,list,mode,extra)=>`<div class="card"><h2>${title} <span class="r">${list.length} jobs · ${sub}</span>${extra||''}</h2><table>${head}<tbody>${list.map(j=>lineRows(j,mode)).join('')||`<tr><td colspan="9" class="msg">None.</td></tr>`}</tbody></table></div>`;
  return `<div class="tiles"><div class="tile ${FILTER.tile==='ready'?'on':''}" onclick="FILTER.tile=FILTER.tile==='ready'?'':'ready';render()"><b>${ready.length}</b><span>Ready to pick in full</span></div><div class="tile ${FILTER.tile==='picking'?'on':''}" onclick="FILTER.tile=FILTER.tile==='picking'?'':'picking';render()"><b>${picking.length}</b><span>Picking</span></div><div class="tile ${FILTER.tile==='prod'?'on':''}" onclick="FILTER.tile=FILTER.tile==='prod'?'':'prod';render()"><b>${prod.length}</b><span>Waiting on production WO</span></div><div class="tile ${FILTER.tile==='wait'?'on':''}" onclick="FILTER.tile=FILTER.tile==='wait'?'':'wait';render()"><b>${wait.length}</b><span>Waiting on stock</span></div></div>
  <div class="card">${filterBar()}</div>
  ${(!FILTER.tile||FILTER.tile==='ready')?group('Ready to pick in full','every garment on the shelf, oldest promised date served first',ready,'tick',`<button class="btn btn-gold btn-sm" ${ticked.length?'':'disabled'} onclick="printPick(${JSON.stringify(ticked).replace(/"/g,'&quot;')})">Print pick lists for ${ticked.length} ticked</button><button class="btn btn-grey btn-sm" onclick="tickAll(${JSON.stringify(ready.map(j=>j.key)).replace(/"/g,'&quot;')})">Tick all</button>`):''}
  ${(!FILTER.tile||FILTER.tile==='picking')?group('Picking','pick list printed, garments being picked',picking,''):''}
  ${(!FILTER.tile||FILTER.tile==='prod')?group('Waiting on a production works order','special makes and planner works orders; pick the rest when it lands',prod,''):''}
  ${(!FILTER.tile||FILTER.tile==='wait')?group('Waiting on stock','back-to-back PO, container or nothing on order',wait,''):''}
  <div class="status">Stock is served to the oldest promised date first, the Order tracker's rule, with Sage's allocation respected. Printing a pick list puts the job in <b>Picking</b>. Bins come from BinFinder's stock file${BIN.ok?'':' (not read)'}. ${w?'':'View only: sign in as the warehouse to print and mark picks.'}</div>`;
}
function tick(k,on){if(on)TICK.add(k);else TICK.delete(k);render()}
function tickAll(keys){const all=keys.every(k=>TICK.has(k));keys.forEach(k=>all?TICK.delete(k):TICK.add(k));render()}
function pickLine(jk,lk,qty){
  const j=JOBS.find(x=>x.key===jk);if(!j||!can('pick'))return;
  ownSave('EMB pick '+j.doc+' '+lk.split('-').pop()+(qty?' picked':' undone'),d=>{const e=d.jobs[jk]||(d.jobs[jk]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.picks=e.picks||{};
    if(qty)e.picks[lk]={qty,at:new Date().toISOString(),by:who()};else delete e.picks[lk];return true},ok=>{if(ok){build();render()}});
}
function pickAll(jk){
  const j=JOBS.find(x=>x.key===jk);if(!j||!can('pick'))return;
  ownSave('EMB pick '+j.doc+' '+j.kind+' all picked',d=>{const e=d.jobs[jk]||(d.jobs[jk]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.picks=e.picks||{};const at=new Date().toISOString(),by=who();
    j.lines.forEach(l=>{if(!e.picks[l.key])e.picks[l.key]={qty:l.out,at,by}});return true},ok=>{if(ok){build();render()}});
}
function printPick(keys){
  const js=keys.map(k=>JOBS.find(j=>j.key===k)).filter(Boolean);if(!js.length)return;
  if(!can('pick')){alert('Sign in as the warehouse to print pick lists.');return}
  document.getElementById('print').innerHTML=js.map(pickDoc).join('');
  window.print();
  TICK.clear();
  if(can('pick'))ownSave('Pick lists printed '+js.map(j=>j.doc).join(', '),d=>{let n=0;js.forEach(j=>{if(j.src!=='sage')return;const e=d.jobs[j.key]||(d.jobs[j.key]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});if(!e.pickPrintedAt)e.pickPrintedAt=new Date().toISOString();e.pickPrintedLast=new Date().toISOString();n++});return n>0},ok=>{if(ok){build();render()}});
  else render();
}
function pickDoc(j){
  return `<div class="wop"><div class="hd"><div><h1>Pick list for ${j.kind==='EMB'?'embroidery':'transfer'}</h1><div>${j.co==='TIBARD'?'Tibard':'Oliver Harvey'} · printed ${fdt(new Date().toISOString())}</div></div><div class="k">${esc(j.src==='sage'?'SO '+j.doc:j.ref)}</div></div>
  <div class="kv"><div><b>Customer</b> ${esc(j.cust)}</div><div><b>Order ref</b> ${esc(j.ref)}</div><div><b>Due in EMB</b> ${fdl(j.due)}</div><div><b>Promised</b> ${fdl(j.promised)}</div><div><b>Logo</b> ${esc(j.logo||'see EMB works order')}</div><div><b>Placement</b> ${esc(j.place||j.sageTxt.join(' / ')||'–')}</div></div>
  <table><thead><tr><th>Bin</th><th>Stock code</th><th>Description</th><th>Qty</th><th>Picked</th></tr></thead><tbody>${j.lines.slice().sort((a,b)=>(a.bin||'~').localeCompare(b.bin||'~')).map(l=>`<tr><td class="bigbin">${esc(l.bin||'?')}</td><td><b>${esc(l.base||l.code)}</b></td><td>${esc(l.desc)}</td><td style="text-align:right;font-size:16px"><b>${l.out}</b></td><td>${l.onShelf?'☐':'waiting: '+esc(waitText(l))}</td></tr>`).join('')}</tbody></table>
  ${j.notes&&j.src==='sage'?`<p style="margin-top:8px"><b>Notes:</b> ${esc(j.notes)}</p>`:''}
  <div class="sign"><div>Picked by / date</div><div>Handed to EMB / date</div><div>Checked</div></div></div>`;
}

/* ── EMB queue ──────────────────────────────────────────────────────────── */
function renderEmb(){
  const list=applyFilter(JOBS.filter(j=>j.status!=='done'));
  const w=can('emb');
  const byM={};list.forEach(j=>{if(j.machine)byM[j.machine]=(byM[j.machine]||0)+j.minutes});
  return `<div class="tiles">${MACHINES.map(m=>`<div class="tile"><b>${list.filter(j=>j.machine===m.id).length}</b><span>${m.name}${byM[m.id]?' · '+Math.round(byM[m.id]/60*10)/10+' h':''}</span></div>`).join('')}</div>
  <div class="card"><h2>EMB queue <span class="r">${list.length} jobs · picked first, then by due date</span></h2>${filterBar()}
  <table><thead><tr><th>Order</th><th>Customer</th><th>Job</th><th>Garments</th><th>Picked</th><th>Due</th><th>Stitches</th><th class="num">Est. min</th><th>Machine</th><th></th></tr></thead><tbody>
  ${list.slice().sort((a,b)=>(a.pickState==='all'?0:1)-(b.pickState==='all'?0:1)||a.due-b.due).map(j=>jobRow(j,j=>`<td>${soCell(j)}</td><td>${esc(j.cust)}</td><td>${kindPill(j.kind)}${logoCell(j)}${j.place?`<div class="muted clip" title="${esc(j.place)}">${esc(j.place)}</div>`:''}${j.woFile?`<div><a href="${esc(OWN_PAGES+j.woFile.path)}" target="_blank" onclick="event.stopPropagation()">WO file ↗</a></div>`:''}</td><td>${linesCell(j)}</td>
   <td>${j.pickState==='all'?'<span class="pill p-pick">Picked</span>':j.pickState==='part'?'<span class="pill p-part">Part picked</span>':pill(j.status)}${j.shortLines&&j.pickState!=='all'?`<div class="muted">${j.shortLines} line${j.shortLines>1?'s':''} not on the shelf</div>`:''}</td>
   <td>${dueCell(j)}</td>
   <td onclick="event.stopPropagation()"><input type="number" min="0" style="width:80px;border:1px solid var(--line);border-radius:5px;padding:4px" value="${j.stitches||''}" ${w?'':'disabled'} onchange="setStitches('${esc(j.key)}',this.value)">${j.stitchesFrom==='memory'?'<div class="muted">from logo memory</div>':''}</td>
   <td class="num">${j.minutes||'<span class="muted">–</span>'}</td>
   <td onclick="event.stopPropagation()">${j.src==='sage'?`<select ${w?'':'disabled'} onchange="setMachine('${esc(j.key)}',this.value)"><option value="">– choose –</option>${MACHINES.map(m=>`<option value="${m.id}" ${j.machine===m.id?'selected':''}>${m.name}</option>`).join('')}</select>`:`<span class="muted">${j.machine?'Machine '+esc(j.machine):'set in the planner'}</span>`}</td>
   <td onclick="event.stopPropagation()">${j.src==='sage'&&w?`<button class="btn btn-green btn-sm" onclick="markDone('${esc(j.key)}')">Done</button>`:''}</td>`,10)).join('')||'<tr><td colspan="10" class="msg">No jobs in the queue.</td></tr>'}</tbody></table>
  <div class="status">Time = stitches ÷ ${SET.spm} per minute per garment + ${SET.setup} min set-up per product, shared over the machine's heads. A stitch count typed here is offered to remember against the job's logo for next time.</div></div>`;
}
function setStitches(k,v){
  const j=JOBS.find(x=>x.key===k);if(!j||!can('emb'))return;const n=+v||0;
  let remember=false,name=j.logo;
  if(n>0){if(!name){name=prompt('Remember this stitch count for which logo? (leave blank to keep it on this job only)','')||'';}
    else remember=confirm('Remember '+n+' stitches for "'+name+'" so the next order gets it automatically?');
    if(name&&!j.logo)remember=true}
  ownSave('EMB job '+j.doc+' '+j.kind+' stitches '+n,d=>{const e=d.jobs[k]||(d.jobs[k]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.stitches=n;if(name&&!e.logo&&!j.logo)e.logo=name;
    if(remember&&name){let l=d.logos.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!l){l={name,acct:j.acct,cust:j.cust,place:j.place||'',at:new Date().toISOString()};d.logos.push(l)}l.stitches=n;l.stitchesAt=new Date().toISOString()}
    return true},ok=>{if(ok){build();render()}});
}
function setMachine(k,m){const j=JOBS.find(x=>x.key===k);if(!j||!can('emb'))return;
  ownSave('EMB job '+j.doc+' '+j.kind+(m?' on machine '+m:' taken off machine'),d=>{const e=d.jobs[k]||(d.jobs[k]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.machine=m;e.machineAt=m?new Date().toISOString():'';return true},ok=>{if(ok){build();render()}})}
function markDone(k){const j=JOBS.find(x=>x.key===k);if(!j||!can('emb'))return;
  if(j.pickState!=='all'&&!confirm('Not every garment is marked picked. Mark the job done anyway?'))return;
  ownSave('EMB job '+j.doc+' '+j.kind+' done',d=>{const e=d.jobs[k]||(d.jobs[k]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.doneAt=new Date().toISOString();e.doneBy=who();return true},ok=>{if(ok){build();render()}})}
function undoDone(k){const j=JOBS.find(x=>x.key===k);if(!j||!can('emb'))return;
  ownSave('EMB job '+j.doc+' '+j.kind+' done mark undone',d=>{const e=d.jobs[k];if(!e)return false;delete e.doneAt;delete e.doneBy;return true},ok=>{if(ok){build();render()}})}
function renderDone(){
  const list=applyFilter(JOBS.filter(j=>j.status==='done')).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  return `<div class="card"><h2>Done, awaiting despatch <span class="r">${list.length} jobs · a job leaves when Sage shows it despatched</span></h2>${filterBar()}
  <table><thead><tr><th>Order</th><th>Customer</th><th>Job</th><th>Garments</th><th>Machine</th><th>Done</th><th></th></tr></thead><tbody>
  ${list.map(j=>`<tr><td>${soCell(j)}</td><td>${esc(j.cust)}</td><td>${kindPill(j.kind)}${logoCell(j)}</td><td>${linesCell(j)}</td><td>${esc((MACHINES.find(m=>m.id===j.machine)||{}).name||j.machine||'')}</td><td>${fdt(j.doneAt)}${j.own&&j.own.doneBy?' · '+esc(j.own.doneBy):''}</td><td>${can('emb')&&j.src==='sage'?`<button class="btn btn-grey btn-sm" onclick="undoDone('${esc(j.key)}')">Undo</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="msg">Nothing done yet.</td></tr>'}</tbody></table></div>`;
}
function renderLogos(){
  const list=OWN.logos.slice().sort((a,b)=>(a.cust||'').localeCompare(b.cust||'')||a.name.localeCompare(b.name));
  return `<div class="card"><h2>Logo memory <span class="r">${list.length} logos · names and stitch counts remembered from jobs; images in phase 3</span></h2>
  <table><thead><tr><th>Customer</th><th>Logo</th><th>Placement</th><th class="num">Stitches</th><th>Remembered</th></tr></thead><tbody>
  ${list.map(l=>`<tr><td>${esc(l.cust||l.acct||'')}</td><td>${esc(l.name)}</td><td>${esc(l.place||'')}</td><td class="num">${l.stitches||'–'}</td><td class="muted">${fdt(l.stitchesAt||l.at)}</td></tr>`).join('')||'<tr><td colspan="5" class="msg">Nothing remembered yet. Type a logo name on a job, or a stitch count in the EMB queue.</td></tr>'}</tbody></table></div>`;
}
function renderSettings(){
  return `<div class="card"><h2>Settings <span class="r">kept on this PC</span></h2><div class="detail"><div class="grid">
  <div class="field"><label>Stitches per minute</label><input id="s_spm" type="number" value="${SET.spm}"></div>
  <div class="field"><label>Set-up minutes per product</label><input id="s_setup" type="number" value="${SET.setup}"></div>
  <div class="field"><label>Lead time Tibard (working days)</label><input id="s_lt" type="number" value="${SET.leadTib}"></div>
  <div class="field"><label>Lead time Oliver Harvey (working days)</label><input id="s_lo" type="number" value="${SET.leadOH}"></div></div>
  <div class="actions"><button class="btn btn-gold" onclick="saveSet()" ${can('settings')?'':'disabled'}>Save</button><span class="muted">Due date = Sage order date + lead time. Machines: 1 to 4 six heads, 5 single head, DTF twin and single presses.</span></div></div>
  ${usersCard()}
  <div class="msg">Feeds: Order tracker ${SOP.ok?'read ('+fdt(SOP.ts)+')':'<b>not read</b>'} · Production Plan ${PP.ok?'read ('+fdt(PP.savedAt)+')':'<b>not read</b>'} · style master ${BRAND.ok?BRAND.styles.length+' branded records':'<b>not read</b>'} · Stock Planner ${SP.ok?'read':'<b>not read</b>'} · warehouse log ${WH.ok?'read':'<b>not read</b>'} · BinFinder ${BIN.ok?BIN.map.size+' bins':'<b>not read</b>'} · emb.json ${OWN.ok?'read ('+(OWN.savedAt?fdt(OWN.savedAt):'empty')+', '+OWN.source+')':'<b>not read</b>'} · v${VER}</div></div>`;
}
function usersCard(){
  const admin=can('users');
  const eu=EDIT_USER==='new'?{key:'',name:'',edits:[]}:EDIT_USER?OWN.users.find(u=>u.key===EDIT_USER):null;
  let h=`<div class="card"><h2>Users and PINs <span class="r">everyone can view; a PIN unlocks editing of the areas below on a PC that holds the token</span></h2>
  <table><thead><tr><th>User</th><th>Can edit</th><th></th></tr></thead><tbody>${OWN.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${USER&&USER.key===u.key?' <span class="pill p-done">signed in here</span>':''}</td><td>${(u.edits||[]).map(a=>(AREAS.find(x=>x[0]===a)||[a,a])[1]).join(', ')||'<span class="muted">view only</span>'}</td><td>${admin?`<button class="btn btn-grey btn-sm" onclick="EDIT_USER='${esc(u.key)}';render()">Edit</button> <button class="btn btn-grey btn-sm" onclick="changePin('${esc(u.key)}')">Reset PIN</button> <button class="btn btn-grey btn-sm" onclick="removeUser('${esc(u.key)}')">Remove</button>`:USER&&USER.key===u.key?`<button class="btn btn-grey btn-sm" onclick="changePin()">Change my PIN</button>`:''}</td></tr>`).join('')}</tbody></table>`;
  if(admin)h+=`<div class="actions" style="padding:0 14px 12px"><button class="btn btn-grey btn-sm" onclick="EDIT_USER='new';render()">Add user</button></div>`;
  if(eu)h+=`<div class="detail"><div class="grid"><div class="field"><label>Name</label><input id="u_name" value="${esc(eu.name)}"></div><div class="field"><label>${eu.key?'New PIN (blank = keep)':'PIN (4+ digits)'}</label><input id="u_pin" inputmode="numeric"></div>
    <div class="field"><label>Can edit</label>${AREAS.map(a=>`<label style="display:inline-block;margin-right:10px;font-size:13px"><input type="checkbox" class="chk" id="u_${a[0]}" ${eu.edits.includes(a[0])?'checked':''}> ${a[1]}</label>`).join('')}</div></div>
    <div class="actions"><button class="btn btn-gold" onclick="saveUser('${esc(eu.key)}')">Save user</button><button class="btn btn-grey" onclick="EDIT_USER=null;render()">Cancel</button></div></div>`;
  h+=`<div class="status">Default PINs when the app is first set up: EMB manager 1111, Sales office 2222, Warehouse 3333, Admin 0000. Change them straight away (Admin → Reset PIN). PINs are stored hashed in emb.json. A share link <code>${esc(OWN_PAGES)}#token=…</code> puts the token on a PC and then disappears from the address bar.</div></div>`;
  return h;
}
function saveSet(){if(!can('settings')){alert('Sign in as the EMB manager to change settings.');return}SET={spm:+val('s_spm')||900,setup:+val('s_setup')||10,leadTib:+val('s_lt')||10,leadOH:+val('s_lo')||7};lsSet(LS_SET,SET);build();render()}

/* ── EMB works order print ──────────────────────────────────────────────── */
function printJobs(keys){
  const js=keys.map(k=>JOBS.find(j=>j.key===k)).filter(Boolean);if(!js.length)return;
  document.getElementById('print').innerHTML=js.map(wop).join('');
  window.print();
  if(can('orders')||can('emb'))ownSave('EMB WO printed '+js.map(j=>j.doc).join(', '),d=>{let n=0;js.forEach(j=>{if(j.src!=='sage')return;const e=d.jobs[j.key]||(d.jobs[j.key]={co:j.co,so:j.doc,kind:j.kind,cust:j.cust});e.printedAt=new Date().toISOString();n++});return n>0},ok=>{if(ok){build();render()}});
}
function wop(j){
  return `<div class="wop"><div class="hd"><div><h1>${j.kind==='EMB'?'Embroidery':'Transfer'} works order</h1><div>${j.co==='TIBARD'?'Tibard':'Oliver Harvey'} · printed ${fdt(new Date().toISOString())}</div></div><div class="k">${esc(j.src==='sage'?'SO '+j.doc:j.ref)}</div></div>
  <div class="kv"><div><b>Customer</b> ${esc(j.cust)}</div><div><b>Order ref</b> ${esc(j.ref)}</div><div><b>Order date</b> ${fdl(j.added)}</div><div><b>Due in EMB</b> ${fdl(j.due)}</div><div><b>Promised to customer</b> ${fdl(j.promised)}</div><div><b>Stitch count</b> ${j.stitches||'–'}</div><div><b>Thread colours</b> ${esc(j.colours||'–')}</div><div><b>Est. time</b> ${j.minutes?j.minutes+' min':'–'}</div></div>
  <div class="big">Logo: ${esc(j.logo||'see Sage text below')}</div><div class="big">Placement: ${esc(j.place||j.sageTxt.join(' / ')||'–')}</div>
  ${j.woFile?`<p>Sales office works order file: ${esc(j.woFile.name)}</p>`:''}
  <table><thead><tr><th>Stock code</th><th>Description</th><th>Qty</th><th>Sage instruction</th><th>Picked</th></tr></thead><tbody>${j.lines.map(l=>`<tr><td><b>${esc(l.base||l.code)}</b>${l.base&&l.base!==l.code?'<br>→ '+esc(l.code):''}</td><td>${esc(l.desc)}</td><td style="text-align:right;font-size:16px"><b>${l.out}</b></td><td>${(l.txt||[]).map(esc).join('<br>')}</td><td>${l.picked?'✔':'☐'}</td></tr>`).join('')}</tbody></table>
  ${j.notes&&j.src==='sage'?`<p style="margin-top:8px"><b>Notes:</b> ${esc(j.notes)}</p>`:''}
  <div class="logo">${j.logoImg?`<img src="${esc(j.logoImg)}" alt="logo">`:'Logo image: attach or draw here'}</div>
  <div class="sign"><div>Picked by / date</div><div>Machine / operator</div><div>Checked / date</div></div></div>`;
}
loadAll();
setInterval(()=>{if(document.visibilityState==='visible')loadAll()},15*60*1000);
</script>
